# =============================================================================
# Corvus GCS — publishing a plugin
# -----------------------------------------------------------------------------
# Called by the workflow of a plugin's own repository (plugins/<id> here, a
# submodule), never by this one. A plugin is one WebAssembly module that every
# system runs, so it is built once, on Linux.
#
# plugin.json names the oldest Corvus GCS the plugin runs in (min_corvus). Every
# version from there on takes it, so nothing is built again for a new Corvus GCS.
# The build checks out that version, or the first published one after it, puts
# the plugin's commit at plugins/<id>, tests it, and lets the published program
# of that version load the module. Only then is it attached to the release
# "plugin" of the plugin's repository, which is where Corvus GCS looks. The list
# there keeps the versions older stations still need.
#
# The releases "abi-..." that 2026.11.93 reads are left as they are.
# =============================================================================
name: plugin

on:
  workflow_call:
    inputs:
      id:
        description: The plugin, the name of its folder under plugins/
        required: true
        type: string
      # Kept so a plugin repository whose workflow still passes it does not fail.
      corvus:
        required: false
        type: string
        default: ''

jobs:
  which:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.which.outputs.tag }}
      build: ${{ steps.which.outputs.build }}
    steps:
      - uses: actions/checkout@v5
      - id: which
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build=false
          tag=""
          if [ ! -f plugin.json ]; then
            echo "::notice::no plugin.json: nothing to publish"
          else
            min="$(jq -r .min_corvus plugin.json)"
            [[ "$min" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]] || { echo "min_corvus is not a version: $min" >&2; exit 1; }
            # The published versions from min_corvus on, the oldest first.
            tag="$(gh api --paginate repos/M-BSquared/CorvusGCS/releases \
                     --jq '.[] | select(.draft | not) | .tag_name' \
                   | grep -E '^v[0-9]{4}\.[0-9]{2}\.[0-9]+$' | sed 's/^v//' \
                   | { cat; echo "$min.min"; } | sort -t. -k1,1n -k2,2n -k3,3n -k4,4r \
                   | sed -n "/\.min$/,\$p" | sed -n '2p')"
            if [ -n "$tag" ]; then
              tag="v$tag"
              build=true
            else
              echo "::notice::Corvus GCS $min is not published yet. Run this again once it is."
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  publish:
    needs: which
    if: needs.which.outputs.build == 'true'
    # An older glibc on purpose, as in build.yml: the published AppImage runs here.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    # One at a time, so two pushes do not write one release at once.
    concurrency:
      group: publish-${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: M-BSquared/CorvusGCS
          ref: ${{ needs.which.outputs.tag }}
          submodules: true
      - name: Make room for the plugin
        env:
          ID: ${{ inputs.id }}
        run: rm -rf "plugins/$ID"
      - uses: actions/checkout@v5
        with:
          path: plugins/${{ inputs.id }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libudev-dev
      # --locked: a plugin uses what Cargo.lock of that version holds.
      - name: Test the plugin
        env:
          ID: ${{ inputs.id }}
        run: |
          crate="corvus_plugin_${ID//-/_}"
          cargo clippy --locked -p "$crate" --all-targets -- -D warnings
          cargo clippy --locked -p "$crate" --target wasm32-wasip1 -- -D warnings
          cargo test --locked -p "$crate"
      - name: Build it and load it in the published program
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ inputs.id }}
          TAG: ${{ needs.which.outputs.tag }}
        run: .github/scripts/plugin-package.sh "$ID" "$TAG"
      - name: Publish
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tools() { cargo run -q --release --locked -p corvus_tools --bin corvus-build -- "$@"; }
          release=plugin
          repo="$GITHUB_REPOSITORY"
          rm -rf build/published
          mkdir -p build/published
          keep=()
          if gh release view "$release" --repo "$repo" >/dev/null 2>&1; then
            if gh release download "$release" --repo "$repo" --pattern plugins-index.json --dir build/published; then
              keep=(--keep build/published/plugins-index.json)
            fi
          else
            gh release create "$release" --repo "$repo" --target "$GITHUB_SHA" --title "Plugin" \
              --notes "Install it in Corvus GCS under Settings, Plugins."
          fi
          tools plugin-index --out dist/plugins "${keep[@]}"
          upload() {
            for attempt in 1 2 3 4 5; do
              gh release upload "$release" "$1" --repo "$repo" --clobber && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          # The modules have their checksum in their name, so nothing is replaced before the
          # list that names the new ones is there.
          for f in dist/plugins/*.wasm; do upload "$f"; done
          upload dist/plugins/plugins-index.json
          gh release edit "$release" --repo "$repo" --notes "Built from $GITHUB_SHA with Corvus GCS ${{ needs.which.outputs.tag }}. Install it in Corvus GCS under Settings, Plugins."
          # What the list no longer names.
          named="$(jq -r '.plugins[].file' dist/plugins/plugins-index.json)"
          gh release view "$release" --repo "$repo" --json assets --jq '.assets[].name' | while read -r name; do
            [ "$name" = plugins-index.json ] || grep -Fxq "$name" <<<"$named" \
              || gh release delete-asset "$release" "$name" --repo "$repo" --yes
          done
