# =============================================================================
# Corvus GCS — GitHub Actions pipeline (mirror of .gitlab-ci.yml)
# -----------------------------------------------------------------------------
# Jobs:
#   test        — pytest suite (python 3.12) on every push, PR, and tag.
#   test-windows— the same suite on Windows; gates windows-app only.
#   frontend    — the plain-node frontend assertions under tests/*.js.
#   appimage    — Linux x86_64 AppImage via ./build.sh   (-> build-appimage.sh).
#   macos-app   — macOS .app + .dmg via ./build.sh --dmg (-> build-macos-app.sh).
#   windows-app — Windows x64 folder + zip via .\build-windows.ps1 (PyInstaller).
#   release     — on a version tag, attach all three artifacts to a GitHub Release.
#
# Packaging cannot be cross-built, so each artifact is produced on its own
# runner. No version is hardcoded anywhere: the build scripts read the repo-root
# VERSION file and the release name comes from the tag.
#
# Keep this in sync with .gitlab-ci.yml — git.unibw.de is the primary CI and
# the two pipelines must not drift.
# =============================================================================
name: build

on:
  push:
    branches: [master, main]
    tags:
      # v?X.Y.Z (semver, optional v) and CalVer YYYY.MM.PP — the same tag shapes
      # the GitLab pipeline releases on. The build reads VERSION regardless.
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9][0-9][0-9][0-9].[0-9]*.[0-9]*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- pytest ----------------------------------------------------------------
  # Installs only the runtime deps the non-GUI unit tests import at module load
  # (corvus.server pulls pymavlink + paramiko; mavlink_bridge uses pyserial
  # lazily). PyQt6 is intentionally NOT installed — no headless test imports Qt.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pymavlink pyserial paramiko
      - name: pytest
        run: pytest -q tests

  # --- the suite on Windows --------------------------------------------------
  # Its own job rather than a matrix leg of `test`: `needs:` waits for every leg
  # of a matrix, so a Windows failure would take the AppImage and the DMG down
  # with it. Only windows-app hangs off this one, which is the honest coupling —
  # a platform nobody tests on is a platform the project only claims to
  # support, but a Windows regression is not a reason to stop shipping Linux.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pymavlink pyserial paramiko
      - name: pytest
        run: pytest -q tests

  # --- frontend assertions (no browser, no test runner) ----------------------
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run frontend tests
        run: |
          set -e
          for f in tests/*.js; do
            echo "--- $f"
            node "$f"
          done

  # --- Linux artifact --------------------------------------------------------
  # ubuntu-22.04 on purpose: the AppImage bundles the host's CPython and links
  # against the host glibc, so building on the oldest supported runner keeps the
  # artifact usable on older field laptops.
  appimage:
    needs: [test, frontend]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip python3-venv wget rsync squashfs-tools \
            imagemagick libfuse2
      - name: Cache appimagetool
        uses: actions/cache@v4
        with:
          path: build/appimagetool-x86_64.AppImage
          key: appimagetool-x86_64
      - name: Build AppImage
        run: |
          chmod +x build.sh build-appimage.sh
          [ -f build/appimagetool-x86_64.AppImage ] && chmod +x build/appimagetool-x86_64.AppImage || true
          ./build.sh
      - name: Read version
        id: ver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Corvus_GCS-${{ steps.ver.outputs.version }}-x86_64-AppImage
          path: Corvus_GCS-*-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

  # --- macOS artifacts (both architectures) ----------------------------------
  # macos-14 is arm64 (Apple Silicon), macos-13 is x86_64 (Intel). Neither can
  # be cross-built and a universal2 bundle would double an already 300 MB
  # download, so each runner produces its own. The build script names the DMG
  # per `uname -m`, so the two never collide — and it now refuses to finish if
  # the payload's architecture disagrees with that name, which is the failure
  # that would otherwise ship an Intel bundle labelled arm64.
  macos-app:
    needs: [test, frontend]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure a framework CPython
        # build-macos-app.sh requires a framework build (conda and some tool-cache
        # pythons are not relocatable into a .app) that runs as the host's own
        # architecture. Homebrew's is one, and its prefix differs per arch:
        # /opt/homebrew on Apple Silicon, /usr/local on Intel. The script's
        # candidate search covers both, so this only has to make sure one exists.
        run: |
          if ! brew list --versions python@3.11 >/dev/null 2>&1; then
            brew install python@3.11 || echo "brew install failed; relying on auto-detection"
          fi
      - name: Show the build architecture
        run: |
          echo "runner arch: $(uname -m)"
          echo "python3:     $(python3 -c 'import platform; print(platform.machine())')"
      - name: Build .app + .dmg
        run: |
          chmod +x build.sh build-macos-app.sh
          ./build.sh --dmg
      - name: Read version and architecture
        id: ver
        # The artifact was named by the runner label (macos-14 / macos-13),
        # which tells a downloader nothing about which Mac it is for. Name it
        # by the architecture the DMG is actually built for instead.
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Corvus_GCS-${{ steps.ver.outputs.version }}-macOS-${{ steps.ver.outputs.arch }}
          path: Corvus_GCS-*-macOS-*.dmg
          if-no-files-found: error
          retention-days: 30

  # --- Windows artifact ------------------------------------------------------
  # PyInstaller rather than the hand-rolled relocatable interpreter the other
  # two platforms need — see the header of build-windows.ps1. Qt's WebEngine
  # payload is large, so this is the slowest of the three jobs.
  windows-app:
    needs: [test-windows, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow, for the .ico
        # Optional in the script (it builds with the default icon without it),
        # installed here so release artifacts always carry the mark.
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Build the Windows app
        shell: pwsh
        run: .\build-windows.ps1 -Zip -Python (Get-Command python).Source
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Corvus_GCS-${{ steps.ver.outputs.version }}-windows-x64
          path: Corvus_GCS-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  # --- release (version tags only) -------------------------------------------
  release:
    needs: [appimage, macos-app, windows-app]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ls -la artifacts
          gh release create "$GITHUB_REF_NAME" \
            --title "Corvus GCS $GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/*
