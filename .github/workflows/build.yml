# =============================================================================
# Corvus GCS — GitHub Actions pipeline (the project's only CI)
# -----------------------------------------------------------------------------
# Jobs:
#   test        — pytest suite (python 3.12) on every push, PR, and tag:
#                 tests/ and each plugin's own plugins/<id>/tests/.
#   test-windows— the same suite on Windows; gates windows-app only.
#   lint        — ruff over corvus/, serve.py, tests/ and plugins/.
#   rust-gui    — rustfmt, clippy and the tests of the interface (Cargo.toml, src/), the
#                 native egui interface every artifact ships.
#   frontend    — the plain-node frontend assertions, tests/*.js and
#                 plugins/<id>/tests/*.js, via python/tools/frontend_tests.js.
#   appimage    — Linux x86_64 AppImage and amd64 .deb via ./build.sh
#                 (-> build-appimage.sh, build-deb.sh).
#   macos-app   — macOS arm64 .app + .dmg via ./build.sh --dmg.
#   windows-app — Windows x64 folder + zip via .\build-windows.ps1 (python.org's
#                 embeddable CPython for the backend, cargo for the interface).
#   release     — on a version tag, attach every artifact to a GitHub Release.
#
# Every job that compiles Rust restores cargo's registry and target folders
# (Swatinem/rust-cache), so a push that changes a few files recompiles those
# and not the 300 crates beneath them.
#
# Packaging cannot be cross-built, so each artifact is produced on its own
# runner. No version is hardcoded anywhere: the build scripts read the repo-root
# VERSION file and the release name comes from the tag.
# =============================================================================
name: build

on:
  push:
    branches: [master, main]
    tags:
      # v?X.Y.Z (semver, optional v) and CalVer YYYY.MM.PP. The build reads
      # VERSION regardless of the tag text.
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9][0-9][0-9][0-9].[0-9]*.[0-9]*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- pytest ----------------------------------------------------------------
  # pyproject.toml's `test` group: the headless runtime deps the non-GUI unit
  # tests import at module load (corvus.server pulls corvus_link + paramiko;
  # mavlink_bridge uses pyserial lazily) plus pytest, and pymavlink, which the
  # corvus_link parity tests compare against. PySide6 is intentionally
  # NOT installed — no headless test imports Qt. `--group` needs pip >= 25.1,
  # hence the upgrade before it.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src/link -> target
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group test
      # MAVLink is corvus_link, a Rust extension built from this checkout. The
      # hosted runners carry cargo; the build fetches maturin and the crates.
      - name: Build corvus_link
        run: pip install ../src/link
      - name: pytest
        run: pytest -q

  # --- the suite on Windows --------------------------------------------------
  # Its own job rather than a matrix leg of `test`: `needs:` waits for every leg
  # of a matrix, so a Windows failure would take the AppImage and the DMG down
  # with it. Only windows-app hangs off this one, which is the honest coupling —
  # a platform nobody tests on is a platform the project only claims to
  # support, but a Windows regression is not a reason to stop shipping Linux.
  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src/link -> target
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group test
      # MAVLink is corvus_link, a Rust extension built from this checkout. The
      # hosted runners carry cargo; the build fetches maturin and the crates.
      - name: Build corvus_link
        run: pip install ../src/link
      - name: pytest
        run: pytest -q

  # --- lint ------------------------------------------------------------------
  # The pipeline ran no linter, which is how six dead locals — an unused
  # AppUserModelID that left the Windows taskbar showing the launcher's icon
  # among them — sat in the tree unnoticed. ruff over corvus/ takes about a
  # second. Scoped to the checks that catch real mistakes rather than style:
  # pyflakes (F), unused imports, and a handful of bug-shaped rules. Runs on
  # its own rather than gating the artifacts, because a lint finding is not a
  # reason to stop shipping.
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group lint
      - name: ruff
        run: ruff check corvus serve.py tests plugins

  # --- the Rust side of corvus_link -----------------------------------------
  # Formatting, clippy with warnings as errors, and the Rust unit tests of the
  # parts that need no Python (CRC, dialect tables, modes, the parameter value
  # codec, the RTCM, UBX and CSV framers, the checksums and the fragment plan).
  # The test binary links libpython, so the loader is pointed at the
  # interpreter's own library folder. The behaviour against pymavlink and the
  # former Python code is pytest's job, in the test jobs above.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/link
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src/link -> target
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      # TLS (wss:) is a default Cargo feature that needs a C compiler; the
      # build without it has to keep compiling for machines that have none.
      - name: build without TLS
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: cargo test
        run: |
          export PYO3_PYTHON="$(command -v python)"
          export LD_LIBRARY_PATH="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          cargo test

  # --- the native interface (Cargo.toml and src/, egui) --------------------------
  # Its own toolchain comes from rust-toolchain.toml at the repository root,
  # which rustup reads. The X11/Wayland headers are what eframe's
  # window and clipboard crates build against on Linux.
  rust-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src/link -> target
      - name: Install the windowing headers
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test

  # --- frontend assertions (no browser, no test runner) ----------------------
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Run frontend tests
        # tests/*.js and every plugin's tests/*.js. The runner fails when it
        # finds nothing at all, so a broken pattern cannot pass by running
        # nothing; a plugin folder that is not there simply has no tests.
        run: node python/tools/frontend_tests.js

  # --- Linux artifact --------------------------------------------------------
  # ubuntu-22.04 on purpose: the AppImage bundles the host's CPython and links
  # against the host glibc, so building on the oldest supported runner keeps the
  # artifact usable on older field laptops.
  appimage:
    needs: [test, frontend, rust-gui]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> build/cargo-gui
            src/link -> target
      # ubuntu-22.04's system python3 is 3.10; the AppImage bundles whatever
      # python3 is first on PATH, and build-appimage.sh refuses anything below
      # the 3.12 floor pyproject.toml declares. setup-python puts 3.12 there.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            wget rsync squashfs-tools imagemagick dpkg-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev
      # The interface is built here with cargo (the repository root, whose
      # rust-toolchain.toml rustup reads). Its X11, Wayland and OpenGL
      # libraries are opened at run time from the machine it runs on.
      # appimagetool and its type-2 runtime are deliberately not cached: a
      # fixed cache key froze an old tool for good. Each build fetches the
      # current continuous release; the static runtime needs no FUSE 2 package.
      - name: Build AppImage and .deb
        run: |
          chmod +x build.sh build-appimage.sh build-deb.sh
          ./build.sh
      - name: Read version
        id: ver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: Corvus_GCS-${{ steps.ver.outputs.version }}-linux-x86_64
          # The .lock beside it is the exact resolved dependency set this
          # AppImage was built from; pyproject.toml only states floors, so
          # it is the lock that makes a rebuild of this tag reproducible.
          path: |
            dist/Corvus_GCS-*-x86_64.AppImage
            dist/Corvus_GCS-*-amd64.deb
            dist/Corvus_GCS-*-x86_64.lock
          if-no-files-found: error
          retention-days: 30

  # --- macOS artifact (Apple Silicon) ----------------------------------------
  # macos-15 is arm64. The interface is built for macOS 12 and later
  # (MIN_MACOS in build-macos-app.sh), and the runner is newer than that, so
  # the bundle's own checks run there. An Intel leg (macos-13) was tried and pulled: it sat
  # queued for over four hours without ever being assigned a runner, and since
  # `release` needs this job, that stalls every release indefinitely. Add it
  # back as its own job — never as a matrix leg of this one — if Intel builds
  # are wanted and the runners come back.
  #
  # The build script names the DMG per `uname -m` and now refuses to finish if
  # the payload's architecture disagrees with that name, which is the failure
  # that would otherwise ship an Intel bundle labelled arm64.
  macos-app:
    needs: [test, frontend, rust-gui]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src/link -> target
      - name: Ensure a framework CPython
        # build-macos-app.sh requires a framework build (conda and some tool-cache
        # pythons are not relocatable into a .app) that runs as the host's own
        # architecture. Homebrew's is one, and its prefix differs per arch:
        # /opt/homebrew on Apple Silicon, /usr/local on Intel. The script's
        # candidate search covers both, so this only has to make sure one exists.
        # 3.12, matching the test job, run.sh and requires-python: this
        # step used to install 3.11, so the artifact was packaged on a version
        # nothing was ever tested against.
        run: |
          if ! brew list --versions python@3.12 >/dev/null 2>&1; then
            brew install python@3.12 || echo "brew install failed; relying on auto-detection"
          fi
      - name: Show the build architecture
        run: |
          echo "runner arch: $(uname -m)"
          echo "python3:     $(python3 -c 'import platform; print(platform.machine())')"
      - name: Build .app + .dmg
        run: |
          chmod +x build.sh build-macos-app.sh
          ./build.sh --dmg
      - name: Smoke-test the bundle
        # The finished .app, run: its own interpreter serves a simulated
        # vehicle, the Rust extension has every feature compiled in, a signal
        # stops it cleanly, and its signature still verifies afterwards.
        run: |
          python3 -m venv "$RUNNER_TEMP/smoke"
          . "$RUNNER_TEMP/smoke/bin/activate"
          python -m pip install --upgrade pip
          cd python
          pip install --group test
          pip install ../src/link
          CORVUS_APP_BUNDLE="$PWD/../dist/Corvus GCS.app" pytest tests/test_bundle_smoke.py -q
      - name: Keep the build logs of a failed build
        # pip, codesign and hdiutil write their reasons to build/*.log, not to
        # the job log, so without these a failed build names no cause.
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: macos-build-logs-${{ github.run_attempt }}
          path: build/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Read version and architecture
        id: ver
        # The artifact was named by the runner label (macos-14 / macos-13),
        # which tells a downloader nothing about which Mac it is for. Name it
        # by the architecture the DMG is actually built for instead.
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: Corvus_GCS-${{ steps.ver.outputs.version }}-macOS-${{ steps.ver.outputs.arch }}
          # See the AppImage job: the .lock is what this artifact's
          # dependencies actually resolved to.
          path: |
            dist/Corvus_GCS-*-macOS-*.dmg
            dist/Corvus_GCS-*-macOS-*.lock
          if-no-files-found: error
          retention-days: 30

  # --- Windows artifact ------------------------------------------------------
  # python.org's embeddable CPython for the backend (no PyInstaller) and cargo
  # for the interface; see the header of build-windows.ps1.
  windows-app:
    needs: [test-windows, frontend, rust-gui]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src/link -> target
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build the Windows app
        shell: pwsh
        run: .\build-windows.ps1 -Zip -Python (Get-Command python).Source
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: Corvus_GCS-${{ steps.ver.outputs.version }}-windows-x64
          # See the AppImage job: the .lock is what this artifact's
          # dependencies actually resolved to.
          path: |
            dist/Corvus_GCS-*-windows-x64.zip
            dist/Corvus_GCS-*-windows-x64.lock
          if-no-files-found: error
          retention-days: 30

  # --- release (version tags only) -------------------------------------------
  release:
    needs: [appimage, macos-app, windows-app]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la artifacts

          # The release is created EMPTY first and each asset uploaded on its
          # own. This used to be a single `gh release create ... artifacts/*`,
          # which is atomic in the worst way: uploads.github.com answers 5xx
          # often enough on assets this size (~250-330 MB each, ~840 MB the
          # set) that one blip discards the whole release along with the
          # uploads that had already succeeded, and the re-run starts again
          # from zero bytes. On v2026.09.44 that failed three times running,
          # each time on a different asset (502, 500, 500), while every build
          # job passed and GitHub reported no incident.
          #
          # Draft until every asset is attached, so nobody is offered a release
          # missing the platform they came for. Every step below is idempotent:
          # a re-run adopts the draft a failed attempt left behind and
          # re-uploads only what did not make it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists - resuming it"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Corvus GCS $GITHUB_REF_NAME" \
              --generate-notes \
              --draft
          fi

          # One asset at a time, each retried on its own with a widening pause.
          # --clobber replaces a half-written asset from an earlier attempt
          # rather than failing because the name is taken.
          upload() {
            local file="$1" attempt
            for attempt in 1 2 3 4 5; do
              if gh release upload "$GITHUB_REF_NAME" "$file" --clobber; then
                echo "uploaded $(basename "$file")"
                return 0
              fi
              echo "attempt $attempt failed for $(basename "$file")" >&2
              sleep $((attempt * 15))
            done
            echo "giving up on $(basename "$file") after 5 attempts" >&2
            return 1
          }

          # What the release already holds, as "name<TAB>size". A re-run then
          # re-uploads only what is absent or the wrong size: an asset a failed
          # attempt left half-written has a size that does not match and is
          # replaced, while an intact one is not sent up a second time. Without
          # this a resume costs the full ~840 MB again to fix one file.
          have="$(gh release view "$GITHUB_REF_NAME" --json assets \
                    --jq '.assets[] | "\(.name)\t\(.size)"' || true)"

          # The .lock beside each bundle is for whoever cuts the next release
          # to pin against (download it from this job's own artifacts, copy it
          # over requirements.lock) — not something an operator downloading
          # the app needs to see next to the AppImage/.dmg/.zip.
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            case "$f" in *.lock) continue ;; esac
            name="$(basename "$f")"
            size="$(wc -c < "$f" | tr -d ' ')"
            if printf '%s\n' "$have" | grep -Fxq "$name	$size"; then
              echo "already on the release, intact: $name"
              continue
            fi
            upload "$f"
          done

          # Refuse to publish half a release. Everything under artifacts/
          # other than the .lock files is what the three build jobs produced —
          # the three bundles — so anything missing here means an upload
          # reported success without taking.
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            case "$f" in *.lock) continue ;; esac
            name="$(basename "$f")"
            if ! gh release view "$GITHUB_REF_NAME" --json assets \
                 --jq '.assets[].name' | grep -Fxq "$name"; then
              echo "asset missing from the release: $name" >&2
              exit 1
            fi
          done

          # Only now is it a release.
          gh release edit "$GITHUB_REF_NAME" --draft=false
          gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) bytes"'
