# =============================================================================
# Corvus GCS — GitHub Actions pipeline (the project's only CI)
# -----------------------------------------------------------------------------
# Jobs:
#   rust-gui    — rustfmt, clippy and the tests of the whole workspace (the
#                 native egui interface, corvus_core, the backend inside it,
#                 corvus_link, the MAVLink crate held to pymavlink's frozen
#                 answers, and corvus_tools, whose tests hold the build
#                 scripts, the manual, the website and the language files to
#                 their contracts), all with --locked. No job needs Python.
#   rust-windows— the same tests on Windows; gates windows-app only.
#   appimage    — Linux x86_64 AppImage and amd64 .deb via ./build.sh
#                 (-> build-appimage.sh, build-deb.sh).
#   macos-app   — macOS arm64 .app + .dmg via ./build.sh --dmg.
#   windows-app — Windows x64 folder + zip via .\build-windows.ps1.
#                 None of the three artifacts holds Python: cargo builds one
#                 program with its backend inside, and each job checks that
#                 (.github/scripts/check-bundle.sh, shell only). They need
#                 rust-gui; `release` waits for all of them.
#   android-app — Android APK (tablet mode on by default) via ./build-android.sh.
#   release     — on a version tag, attach every artifact to a GitHub Release.
#
# Every job that compiles Rust restores cargo's registry and target folders
# (Swatinem/rust-cache), so a push that changes a few files recompiles those
# and not the 300 crates beneath them.
#
# Packaging cannot be cross-built, so each artifact is produced on its own
# runner. No version is hardcoded anywhere: the build scripts read the repo-root
# VERSION file and the release name comes from the tag.
# =============================================================================
name: build

on:
  push:
    branches: [master, main]
    tags:
      # v?X.Y.Z (semver, optional v) and CalVer YYYY.MM.PP. The build reads
      # VERSION regardless of the tag text.
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9][0-9][0-9][0-9].[0-9]*.[0-9]*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- the native interface (Cargo.toml and src/, egui) --------------------------
  # Its own toolchain comes from rust-toolchain.toml at the repository root,
  # which rustup reads. The X11/Wayland headers are what eframe's
  # window and clipboard crates build against on Linux.
  rust-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install the windowing headers
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The Rust 1.99 toolchain, formatting, clippy and tests cover the whole
      # workspace, src/link (the MAVLink crate) included, with the features the
      # program uses. The optional one, wss (tls), is checked on its own.
      - name: clippy, corvus_link with TLS
        run: cargo clippy -p corvus_link --all-targets --features tls --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast

  # --- the tests on Windows --------------------------------------------------
  # Its own job rather than a matrix leg of rust-gui: `needs:` waits for every
  # leg of a matrix, so a Windows failure would take the AppImage and the DMG
  # down with it. Only windows-app hangs off this one.
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast

  # --- Linux artifact --------------------------------------------------------
  # ubuntu-22.04 on purpose: the interface links the host's glibc, so building
  # on the oldest supported runner keeps the artifact usable on older field
  # laptops.
  appimage:
    needs: [rust-gui]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            wget squashfs-tools dpkg-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev
      # The interface is built here with cargo (the repository root, whose
      # rust-toolchain.toml rustup reads), backend included. Its X11, Wayland
      # and OpenGL libraries are opened at run time from the machine it runs
      # on. appimagetool and its type-2 runtime are deliberately not cached: a
      # fixed cache key froze an old tool for good. Each build fetches the
      # current continuous release; the static runtime needs no FUSE 2 package.
      - name: Build AppImage and .deb
        run: |
          chmod +x build.sh build-appimage.sh build-deb.sh
          ./build.sh
      # The finished artifact, unpacked: no interpreter, package or PyO3
      # extension may be in it.
      - name: Check that no Python is inside
        run: |
          cd "$RUNNER_TEMP"
          chmod +x "$GITHUB_WORKSPACE"/dist/Corvus_GCS-*-x86_64.AppImage
          "$GITHUB_WORKSPACE"/dist/Corvus_GCS-*-x86_64.AppImage --appimage-extract >/dev/null
          "$GITHUB_WORKSPACE/.github/scripts/check-bundle.sh" squashfs-root \
            usr/bin/corvus-gcs-ui VERSION LICENSE.md
      - name: Read version
        id: ver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: Corvus_GCS-${{ steps.ver.outputs.version }}-linux-x86_64
          path: |
            dist/Corvus_GCS-*-x86_64.AppImage
            dist/Corvus_GCS-*-amd64.deb
          if-no-files-found: error
          retention-days: 30

  # --- macOS artifact (Apple Silicon) ----------------------------------------
  # macos-15 is arm64. The interface is built for macOS 12 and later
  # (MIN_MACOS in build-macos-app.sh), and the runner is newer than that, so
  # the bundle's own checks run there. An Intel leg (macos-13) was tried and pulled: it sat
  # queued for over four hours without ever being assigned a runner, and since
  # `release` needs this job, that stalls every release indefinitely. Add it
  # back as its own job — never as a matrix leg of this one — if Intel builds
  # are wanted and the runners come back.
  #
  # The build script names the DMG per `uname -m` and now refuses to finish if
  # the payload's architecture disagrees with that name, which is the failure
  # that would otherwise ship an Intel bundle labelled arm64.
  macos-app:
    needs: [rust-gui]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Build .app + .dmg
        run: |
          chmod +x build.sh build-macos-app.sh
          ./build.sh --dmg
      - name: Smoke-test the bundle
        # The finished .app: it holds no Python of any kind, carries the
        # version and the licence, its signature verifies, and it starts and
        # prints its usage. (build-macos-app.sh also checks the libraries.)
        run: |
          app="dist/Corvus GCS.app"
          .github/scripts/check-bundle.sh "$app" Contents/MacOS/corvus-gcs Contents/Resources/VERSION Contents/Resources/LICENSE.md
          "$app/Contents/MacOS/corvus-gcs" --help | head -n 5
          codesign --verify --deep --strict "$app"
          CORVUS_APP_BUNDLE="$PWD/$app" cargo test --locked -p corvus_tools --test bundle_smoke
      - name: Keep the build logs of a failed build
        # cargo, codesign and hdiutil write their reasons to build/*.log, not to
        # the job log, so without these a failed build names no cause.
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: macos-build-logs-${{ github.run_attempt }}
          path: build/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Read version and architecture
        id: ver
        # The artifact was named by the runner label (macos-14 / macos-13),
        # which tells a downloader nothing about which Mac it is for. Name it
        # by the architecture the DMG is actually built for instead.
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: Corvus_GCS-${{ steps.ver.outputs.version }}-macOS-${{ steps.ver.outputs.arch }}
          path: dist/Corvus_GCS-*-macOS-*.dmg
          if-no-files-found: error
          retention-days: 30

  # --- Windows artifact ------------------------------------------------------
  # cargo builds the one program, backend inside; see the header of
  # build-windows.ps1. The script fails the build if any Python is in the folder.
  windows-app:
    needs: [rust-gui, rust-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Build the Windows app
        shell: pwsh
        run: .\build-windows.ps1 -Zip
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: Corvus_GCS-${{ steps.ver.outputs.version }}-windows-x64
          path: dist/Corvus_GCS-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  # --- Android artifact ------------------------------------------------------
  # A WebView shell (android/) on a Corvus GCS server on the network, so no
  # Python is bundled. The runner image ships the Android SDK and Gradle.
  android-app:
    needs: [rust-gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the Android app
        run: ./build-android.sh
      - name: Read version
        id: ver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: Corvus_GCS-${{ steps.ver.outputs.version }}-android
          path: dist/Corvus_GCS-*-android.apk
          if-no-files-found: error
          retention-days: 30

  # --- release (version tags only) -------------------------------------------
  release:
    needs: [rust-gui, rust-windows, appimage, macos-app, windows-app, android-app]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la artifacts

          # The release is created EMPTY first and each asset uploaded on its
          # own. This used to be a single `gh release create ... artifacts/*`,
          # which is atomic in the worst way: uploads.github.com answers 5xx
          # often enough on assets this size (~250-330 MB each, ~840 MB the
          # set) that one blip discards the whole release along with the
          # uploads that had already succeeded, and the re-run starts again
          # from zero bytes. On v2026.09.44 that failed three times running,
          # each time on a different asset (502, 500, 500), while every build
          # job passed and GitHub reported no incident.
          #
          # Draft until every asset is attached, so nobody is offered a release
          # missing the platform they came for. Every step below is idempotent:
          # a re-run adopts the draft a failed attempt left behind and
          # re-uploads only what did not make it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists - resuming it"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Corvus GCS $GITHUB_REF_NAME" \
              --generate-notes \
              --draft
          fi

          # One asset at a time, each retried on its own with a widening pause.
          # --clobber replaces a half-written asset from an earlier attempt
          # rather than failing because the name is taken.
          upload() {
            local file="$1" attempt
            for attempt in 1 2 3 4 5; do
              if gh release upload "$GITHUB_REF_NAME" "$file" --clobber; then
                echo "uploaded $(basename "$file")"
                return 0
              fi
              echo "attempt $attempt failed for $(basename "$file")" >&2
              sleep $((attempt * 15))
            done
            echo "giving up on $(basename "$file") after 5 attempts" >&2
            return 1
          }

          # What the release already holds, as "name<TAB>size". A re-run then
          # re-uploads only what is absent or the wrong size: an asset a failed
          # attempt left half-written has a size that does not match and is
          # replaced, while an intact one is not sent up a second time. Without
          # this a resume costs the full ~840 MB again to fix one file.
          have="$(gh release view "$GITHUB_REF_NAME" --json assets \
                    --jq '.assets[] | "\(.name)\t\(.size)"' || true)"

          for f in artifacts/*; do
            [ -f "$f" ] || continue
            case "$f" in *.lock) continue ;; esac
            name="$(basename "$f")"
            size="$(wc -c < "$f" | tr -d ' ')"
            if printf '%s\n' "$have" | grep -Fxq "$name	$size"; then
              echo "already on the release, intact: $name"
              continue
            fi
            upload "$f"
          done

          # Refuse to publish half a release. Everything under artifacts/
          # other than the .lock files is what the three build jobs produced —
          # the four bundles — so anything missing here means an upload
          # reported success without taking.
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            case "$f" in *.lock) continue ;; esac
            name="$(basename "$f")"
            if ! gh release view "$GITHUB_REF_NAME" --json assets \
                 --jq '.assets[].name' | grep -Fxq "$name"; then
              echo "asset missing from the release: $name" >&2
              exit 1
            fi
          done

          # Only now is it a release.
          gh release edit "$GITHUB_REF_NAME" --draft=false
          gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) bytes"'
