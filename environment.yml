name: corvus-gcs
channels:
  - conda-forge
  - defaults
dependencies:
  # 3.12 is what CI tests and what the build scripts target. One version
  # across dev, CI and the shipped artifact, so "it passes CI" means "it runs
  # on what we ship".
  - python=3.12
  - pip
  - pip:
      # The one runtime list, shared with all three build scripts (and, via
      # requirements-headless.txt, with both CI pipelines). Do not add
      # packages here — add them to requirements.txt.
      - -r requirements.txt
      - -r requirements-dev.txt
