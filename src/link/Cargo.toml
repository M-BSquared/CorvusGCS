[package]
name = "corvus_link"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "MAVLink for Corvus GCS: wire format, dialect tables, signing and the serial, UDP and TCP links"
build = "build.rs"

[lib]
name = "corvus_link"
path = "lib.rs"

[features]
# None on by default; `tls` is asked for where wanted.
default = []
# wss: needs a C compiler for ring.
tls = ["dep:rustls", "dep:rustls-native-certs"]

[dependencies]
sha2 = "0.10"
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8.5", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Networking_WinSock"] }
serialport = { version = "4", default-features = false }

[build-dependencies]
roxmltree = "0.20"

[dev-dependencies]
# The plain layer's tests read the frames and tables pymavlink produced,
# frozen once into tests/data (pymavlink.json.gz is gzipped).
serde_json = "1"
flate2 = { workspace = true }
