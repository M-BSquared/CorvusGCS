[package]
name = "corvus_api"
version = "0.0.0"
edition = "2021"
rust-version = "1.99"
publish = false
description = "What a Corvus GCS plugin builds on: the interface widgets, the translations, the backend client"
build = "build.rs"

[dependencies]
eframe = { workspace = true }
# One waiting queue for the locks the program and a plugin library share (plugin::dynamic).
parking_lot_core = "0.9.12"
egui_extras = { workspace = true }
image = { workspace = true }
# With the features the core turns on for the program: a `Value` crosses the boundary to a plugin
# library, and its layout depends on them.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
vte = { workspace = true }
regex = { workspace = true }
rfd = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[build-dependencies]
wuff = "0.2"
