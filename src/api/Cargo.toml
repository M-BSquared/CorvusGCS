[package]
name = "corvus_api"
version = "0.0.0"
edition = "2021"
rust-version = "1.99"
publish = false
description = "What a Corvus GCS plugin builds on: the interface widgets, the translations, the backend client"
build = "build.rs"

[dependencies]
# egui alone, so the crate also builds for the plugins, which have no window of their own.
egui = { workspace = true }
# The protocol between the program and a plugin (wire.rs): MessagePack with field names, so
# either side may be newer than the other.
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
serde_bytes = "0.11"
egui_extras = { workspace = true }
image = { workspace = true }
# With the features the core turns on for the program: a `Value` crosses the boundary to a plugin
# library, and its layout depends on them.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
vte = { workspace = true }
regex = { workspace = true }

# What only the program needs: the frosted glass is an OpenGL callback, the file dialog is
# the system's. A plugin asks the program for both.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
eframe = { workspace = true }
rfd = { workspace = true }
# HTTPS to a hosted model or another server (net::fetch): the same rustls and certificate store
# the core uses for its own downloads.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[build-dependencies]
wuff = "0.2"
