[package]
name = "corvus_core"
version = "0.0.0"
edition = "2021"
rust-version = "1.99"
publish = false
description = "The Corvus GCS backend as a library: router, state store, settings and the optional HTTP server"

[[bin]]
name = "corvus-core"
path = "src/bin/corvus-core.rs"

[dependencies]
# The MAVLink crate without its Python layer: the dialect tables, the transports
# and the plain codec and framing.
corvus_link = { path = "../link", default-features = false }
# preserve_order: a settings file keeps the order its keys were written in,
# as Python's dict does, so the Rust and the Python program can share a folder.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
base64 = "0.22"
indexmap = "2"
# Only the WebSocket handshake needs SHA-1; both are already in the lock file.
sha1 = "0.10"
# The MCP access token is 32 random bytes.
getrandom = "0.3"
# corvus-core, the headless binary, stops cleanly on SIGINT and SIGTERM.
ctrlc = { version = "3", features = ["termination"] }
# Port enumeration (USB descriptors) for auto connect; the link crate already builds it.
serialport = { version = "4", default-features = false }
# The forwarder binds its UDP socket with SO_REUSEADDR as Python did; the link crate already builds it.
socket2 = { version = "0.5", features = ["all"] }

# The offline tile cache is an MBTiles file: SQLite, read and written by the
# same file layout Python's sqlite3 module uses. "bundled" compiles SQLite into
# the binary, so no system library is needed on any platform the bundle ships.
rusqlite = { version = "0.37", features = ["bundled"] }
# Upstream tiles, the place search and the Overpass cells are HTTPS. rustls with
# the platform's own certificate store (as Python's urllib uses the system's),
# no async runtime, no thread of its own.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
# The operator's own elevation grids are float32 files read through a memory map, as
# Python's mmap did, so a model larger than the RAM it would need still serves. Already
# in the lock file (a dependency of the interface's crates).
memmap2 = "0.9"
# Elevation tiles are PNG: flate2 is the zlib the Python decoder used.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The update check reads the release list of GitHub over https: the one request the
# core makes on its own. The same TLS stack corvus_link uses for wss (ring, so a
# second provider elsewhere cannot make the choice ambiguous) and the system's
# certificate store. Already in the lock file.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
# PX4 keeps its parameter metadata in parameters.json.xz (setup_schemas::param_metadata); the stdlib has no xz.
lzma-rs = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
# Lists the serial ports with their USB descriptor (IOKit, the Windows registry); Linux reads sysfs itself.
serialport = { version = "4", default-features = false }
