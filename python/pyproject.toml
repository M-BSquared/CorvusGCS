[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# Tooling-only placeholder. The real app version is the VERSION file at the
# repo root; it is never read from here.
name = "corvus-gcs"
version = "0.0.0"
# 3.12: the version CI tests and run.sh creates the venv with.
requires-python = ">=3.12"

# Every Python package the tests and tools install is named in this table and
# nowhere else: the venv (run.sh --venv) and the CI pipeline read it with
# `pip install --group <file>:<group>` (pip >= 25.1).
[dependency-groups]
# What is left of Python here is tests and tools: the tests that hold the Rust
# link (corvus_link) and the bundles to their contracts, the simulated aircraft
# in tools/scene_kit and the build helpers. The program itself is Rust and
# ships no Python.
#
# MAVLink is not in this table: it is corvus_link, built from src/link
# (a Rust extension with pymavlink's interface), and the venv builds it with
# `pip install <repo>/src/link` after the group. That needs a Rust toolchain.
headless = [
    # The simulated companion computer's SSH server (tools/scene_kit).
    "paramiko>=3.0",
    # The serial links the corvus_link tests open.
    "pyserial>=3.5",
]
# The CI test jobs.
test = [
    { include-group = "headless" },
    "pytest>=7.0",
    # The reference corvus_link is held to: the parity tests compare every
    # message, constant and frame against it, and the simulated vehicle in
    # tools/scene_kit speaks it. Never shipped.
    "pymavlink>=2.4",
    # What pymavlink's WebSocket links need; the parity tests run its wsserver:
    # and ws: links against the Rust ones. Never shipped.
    "wsproto>=1.2",
]
# The bundle smoke test (tests/test_bundle_smoke.py): it runs a finished artifact
# and imports nothing of the backend, so it needs only pytest.
smoke = ["pytest>=7.0"]
# The linter CI runs.
lint = ["ruff>=0.5"]
# The venv that `./run.sh --venv` creates: the suite and the linter.
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# python/ on sys.path, so `import tools...` resolves however pytest is started.
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with `-m \"not slow\"`)",
    "sitl: marks tests requiring a live PX4 SITL connection",
]

[tool.ruff]
# CI runs `ruff check corvus tests tools`. This section is
# what "clean" means, and it is deliberately narrow: the point of adding a
# linter to a codebase this size is to catch mistakes, not to start a
# reformatting argument. Line length is not enforced at all.
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# F  — pyflakes: the dead locals and unused imports that motivated this.
# E9 — syntax and IO errors ruff can find without running anything.
# B  — flake8-bugbear: mutable default arguments, loop-variable capture in a
#      closure, `except` that swallows a bare Exception used as control flow.
# UP — pyupgrade, limited to what py312 makes unambiguous.
select = ["F", "E9", "B", "UP"]
ignore = [
    # `except Exception:` with a logged traceback is the house pattern for
    # "this must never take the process down", used deliberately in every
    # builder and every teardown step. It is not an accident to flag.
    "B904",
    # Zip without strict= is fine where the lengths are established above it.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on the shapes they build; a few of them rebuild a module's
# constants on purpose, which bugbear reads as a redefinition.
"tests/*" = ["B011", "B017"]
