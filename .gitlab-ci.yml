# =============================================================================
# Corvus GCS — GitLab CI pipeline (self-hosted GitLab at git.unibw.de)
# -----------------------------------------------------------------------------
# Stages:
#   test    — pytest suite on every push and merge request (python:3.12).
#   release — on a version tag (v?X.Y.Z or CalVer YYYY.M.P) build the Linux
#             x86_64 AppImage via build-appimage.sh, expose it as a job
#             artifact, and create a GitLab Release with the AppImage linked.
#
# No version is hardcoded anywhere: the build reads VERSION from the repo root
# and the release name/tag come from $CI_COMMIT_TAG.
#
# Runner requirement: a Linux x86_64 runner with the docker executor. The
# release build needs ~1 GB free disk for the AppDir + Qt wheels + appimagetool.
# The release stage also requires the runner to be able to fetch GitLab's
# release-cli (registry.gitlab.com) for the `release:` keyword.
#
# macOS and Windows artifacts: neither can be cross-built, and this instance
# has only Linux runners. Both are produced by .github/workflows/build.yml
# (`macos-app` and `windows-app`) or locally — `./build.sh --dmg` on a Mac,
# `.\\build-windows.ps1 -Zip` from PowerShell. Add a `macos`- or `windows`-tagged
# runner here and the same one-line invocation produces the artifact in CI.
# Keep this pipeline and .github/workflows/build.yml in sync — they must not
# drift.
# =============================================================================

variables:
  # Keep pip's wheel cache inside the checkout so the GitLab cache restores it
  # reliably (project-relative equivalent of ~/.cache/pip). Cached for the
  # test stage only; the release stage caches just the tiny appimagetool
  # binary to stay under the default runner cache-size limit (PyQt6 is large).
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  # Avoid interactive prompts (e.g. tzdata) during apt-get in the release stage.
  DEBIAN_FRONTEND: "noninteractive"

# Run pipelines for merge requests, tags, and branch pushes. When a branch
# already has an open MR, skip the branch pipeline so the suite does not run
# twice (the MR pipeline above handles it).
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test
  - release

# --- Stage 1: test -----------------------------------------------------------
# No job-level rules: runs on every pipeline the workflow allows (branch pushes,
# tag pushes, and merge requests). Lightweight: installs only the runtime
# deps the non-GUI unit tests import at module load (corvus.server pulls
# pymavlink + paramiko; mavlink_bridge uses pyserial lazily). PyQt6 is
# intentionally NOT installed — no headless test imports Qt.
test:
  stage: test
  image: python:3.12
  cache:
    key: test-pip
    paths:
      - .pip-cache/
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements-dev.txt
    - pip install pymavlink pyserial paramiko
    # --junitxml so GitLab lists the failing test by name in the pipeline view
    # and the MR widget, instead of leaving a red job whose reason is buried in
    # the raw log.
    - pytest -q tests --junitxml=report-pytest.xml
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - report-pytest.xml
    reports:
      junit: report-pytest.xml
  allow_failure: false

# --- Stage 1: frontend tests -------------------------------------------------
# The browser-side suite is plain Node-runnable assertion files (no runner, no
# browser). It was missing here entirely while .github/workflows/build.yml has
# run it all along — so every one of these files went unchecked on the primary
# pipeline. AGENTS.md: the two pipelines must not drift.
frontend:
  stage: test
  image: node:20
  script:
    # Deliberately POSIX sh: no arrays and no `shopt`, so this behaves the same
    # whichever shell the runner picks for the job. An unmatched glob would
    # otherwise pass itself through as a literal filename and "succeed" by
    # running nothing, so the count is checked explicitly.
    - |
      set -e
      found=0
      for f in tests/*.js; do
        [ -e "$f" ] || continue
        found=1
        echo "--- $f"
        node "$f"
      done
      if [ "$found" -ne 1 ]; then
        echo "no frontend test files found — expected tests/*.js" >&2
        exit 1
      fi
  allow_failure: false

# --- Stage 2: release (version tags only) ------------------------------------
release_appimage:
  stage: release
  # 22.04, matching .github/workflows/build.yml, and not only for parity: an
  # AppImage links against the glibc of the machine that built it, so one built
  # on 24.04 (glibc 2.39) refuses to start on a 22.04 or Debian 12 laptop. The
  # oldest supported build host is the correct one for a field tool that has to
  # run on whatever is in the bag.
  image: ubuntu:22.04
  rules:
    # v?X.Y.Z (semver, optional v) — already covers CalVer YYYY.M.P; the
    # explicit CalVer alternation is listed for clarity. The build itself
    # reads the version from the VERSION file, independent of the tag text.
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$|^\d{4}\.\d+\.\d+$/'
  cache:
    # Cache the ~1.5 MB appimagetool binary across releases (downloaded once).
    key: appimagetool
    paths:
      - build/appimagetool-x86_64.AppImage
  script:
    - apt-get update -y
    # Matches the package set in .github/workflows/build.yml. The three that
    # were missing here are not cosmetic:
    #   ca-certificates — the build fetches appimagetool and the PyQt6 wheels
    #                     over HTTPS; a bare container may carry no trust store.
    #   libfuse2        — appimagetool is itself an AppImage and wants FUSE.
    #                     build-appimage.sh can fall back to extract-and-run and
    #                     then to unsquashfs, but those paths are the fallback,
    #                     not the one to rely on.
    #   imagemagick     — without it the icon ships at whatever size the source
    #                     logo happens to be instead of 256x256.
    - >-
      apt-get install -y ca-certificates python3 python3-pip python3-venv
      wget rsync squashfs-tools imagemagick libfuse2
    - chmod +x build-appimage.sh
    # Ensure a cache-restored appimagetool is executable (mode is usually
    # preserved, but this guards against runners that drop the x bit).
    - if [ -f build/appimagetool-x86_64.AppImage ]; then chmod +x build/appimagetool-x86_64.AppImage; fi
    - ./build-appimage.sh
    # Derive the artifact filename from the VERSION file (never hardcoded) and
    # expose it to the release: step via a dotenv report artifact.
    - |
      set -e
      CORVUS_VERSION="$(cat VERSION)"
      CORVUS_APPIMAGE="Corvus_GCS-${CORVUS_VERSION}-x86_64.AppImage"
      test -f "$CORVUS_APPIMAGE"
      {
        printf 'CORVUS_VERSION=%s\n' "$CORVUS_VERSION"
        printf 'CORVUS_APPIMAGE=%s\n' "$CORVUS_APPIMAGE"
        printf 'CORVUS_APPIMAGE_URL=%s/-/jobs/%s/artifacts/raw/%s\n' \
          "$CI_PROJECT_URL" "$CI_JOB_ID" "$CORVUS_APPIMAGE"
      } > release.env
  artifacts:
    # `when: always` so a FAILED build still uploads build/*.log. The script
    # writes pip and appimagetool output to files rather than stdout, so on a
    # failure the reason was previously discarded with the container and the
    # job left nothing to diagnose from.
    when: always
    paths:
      - Corvus_GCS-*-x86_64.AppImage
      - build/*.log
    expire_in: 30 days
    reports:
      dotenv: release.env
  release:
    name: 'Corvus GCS $CI_COMMIT_TAG'
    tag_name: '$CI_COMMIT_TAG'
    description: 'Corvus GCS release $CI_COMMIT_TAG. The Linux x86_64 AppImage is attached as a build artifact and linked below.'
    assets:
      links:
        - name: 'Corvus GCS AppImage (Linux x86_64)'
          url: '$CORVUS_APPIMAGE_URL'
          link_type: other
