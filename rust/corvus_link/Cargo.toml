[package]
name = "corvus_link"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "MAVLink for Corvus GCS: wire format, dialect tables, signing and the serial, UDP and TCP links"
build = "build.rs"

[lib]
name = "corvus_link"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.25", features = ["abi3-py312"] }
sha2 = "0.10"
indexmap = "2"
socket2 = { version = "0.5", features = ["all"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Networking_WinSock"] }
serialport = { version = "4", default-features = false }

[build-dependencies]
roxmltree = "0.20"

[profile.release]
lto = "thin"
codegen-units = 1
